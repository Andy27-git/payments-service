[project]
name = "payments-service"
version = "0.1.0"
description = "Асинхронный сервис процессинга платежей: outbox, RabbitMQ consumer, webhook с retry и DLQ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "faststream[rabbit]>=0.5.33",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
]

[tool.uv]
# это приложение, а не библиотека: не нужен build-backend/установка пакета,
# код запускается из src/ напрямую (uvicorn --app-dir, sys.path в alembic/env.py)
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# src/ не устанавливается как пакет (tool.uv package = false) — добавляем в sys.path так же,
# как это делает uvicorn --app-dir в рантайме и alembic/env.py для миграций
pythonpath = ["src"]
markers = [
    "pg: тесты, требующие реальный Postgres через testcontainers (нужен Docker)",
]
testpaths = ["tests"]
# pg-тесты запускаются только явным `pytest -m pg`, а не при обычном прогоне —
# без этого testcontainers пытался бы поднять Postgres в любом окружении с Docker
addopts = "-m 'not pg'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# B008: Depends(...) в дефолтах аргументов — идиоматичный паттерн FastAPI, не баг
ignore = ["B008"]
